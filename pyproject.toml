[project]
name = "AI-for-Healthcare-1D-project"
version = "0.1.0"
description = "존나귀찮노"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "datasets==3.6.0",
  "evaluate>=0.4.6",
  "huggingface-hub[hf-xet]==0.33.2",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pandas>=2.0.0",
  "openpyxl>=3.0.0",
  "scikit-learn>=1.7.2",
  "tensorboard>=2.20.0",
  "tqdm==4.67.1",
  "transformers[torch]==4.53.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.9",
  "faiss-gpu-cu12>=1.13.2",
  "openai>=2.28.0",
]

[project.optional-dependencies]
cpu = ["torch==2.6.0", "torchaudio==2.6.0", "torchvision==0.21.0"]
cu124 = ["torch==2.6.0", "torchaudio==2.6.0", "torchvision==0.21.0"]

[tool.uv]
index-strategy = "unsafe-best-match"
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }]]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

